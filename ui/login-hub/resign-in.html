<div class="card card--auth" data-testid="page-resign-in">
<div class="card__header"><div><h1>Sign in to {{product}}</h1><p class="card__subtitle">For security, {{product}} asks for your sign-in again.</p></div></div>
<div data-testid="error-resign-in">{{{error}}}</div>
<form id="f" novalidate method="post" action="{{action}}" data-nonce-url="{{action}}/attest-nonce" data-agent-url="{{agent}}">
<input type="hidden" name="__RequestVerificationToken" value="{{af}}">
<input type="hidden" name="device_attestation" value="">
<div class="field"><label class="field__label" for="u2">Username</label><input class="field__input" id="u2" name="username" data-testid="field-resign-in-username" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" required></div>
<div class="field"><label class="field__label" for="p2">Password</label><input class="field__input" id="p2" name="password" data-testid="field-resign-in-password" type="password" autocomplete="current-password" required></div>
<button class="button button--primary btn-primary button--block" type="submit" data-testid="resign-in-submit"><span class="btn-primary__press">Continue</span></button>
</form>
</div>
