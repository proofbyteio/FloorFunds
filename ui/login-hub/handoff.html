<section class="card card--auth card--center">
<div class="card__header"><div><h1>Opening {{product}}</h1></div></div>
<div aria-live="polite"><span class="spinner" aria-hidden="true"></span> Opening {{product}}…</div>
<form id="handoff" method="post" action="{{action}}" data-nonce-url="{{action}}/handoff-nonce" data-agent-url="{{agent}}">
<input type="hidden" name="__RequestVerificationToken" value="{{af}}"><input type="hidden" name="device_attestation" value="">
<noscript><button class="button button--primary btn-primary button--block" type="submit"><span class="btn-primary__press">Continue</span></button></noscript>
</form>
</section>
