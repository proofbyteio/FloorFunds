<section class="card card--auth" data-testid="screen-reenroll">
<div class="card__header"><div><h1>Set up your authenticator again</h1></div></div>
{{{error}}}
<p>Add this account to your authenticator app, then enter the 6-digit code it shows.</p>
<div class="field"><span class="field__label">Manual key</span><code id="manual-key" data-testid="reenroll-manual-key">{{key}}</code></div>
<div class="field"><span class="field__label">Setup link</span><code id="otpauth" data-testid="reenroll-otpauth">{{uri}}</code></div>
<form novalidate method="post" action="{{action}}">
<input type="hidden" name="__RequestVerificationToken" value="{{af}}">
<div class="field"><label class="field__label" for="totp">6-digit code</label><input class="field__input" id="totp" name="totp_code" data-testid="totp-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" required></div>
<button class="button button--primary button--block" type="submit" data-testid="reenroll-submit">Confirm</button>
</form>
<a href="{{signout}}">Sign out</a>
</section>
